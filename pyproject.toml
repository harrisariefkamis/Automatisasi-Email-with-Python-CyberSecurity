[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-job-assistant"
version = "0.3.0"
description = "Privacy-conscious email job triage starter"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.40", "pydantic>=2.7,<3", "google-api-python-client>=2.130,<3", "google-auth>=2.30,<3", "openai>=1.40,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[project.scripts]
email-assistant = "email_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
